name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      NETLIFY_AUTH_TOKEN: nfp_Q2GTcptKdh5vL21yX3sPd7mVVhvN6dBCc84e
      NETLIFY_ACCOUNT_SLUG: Soujash
      NETLIFY_SITE_ID: 16238f05-9faf-4a15-9b0a-247dfb67a1c7

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm i

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Link Netlify site
        run: netlify link --id "$NETLIFY_SITE_ID"

      - name: Build
        run: npm run build

      - name: Deploy to Netlify
        run: netlify deploy --prod --dir=out --site="$NETLIFY_SITE_ID" --message="GH Actions ${{ github.sha }}"
